services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - user=${APP_USER}
        - uid=${APP_UID}
    container_name: edsa_laravel
    restart: unless-stopped
    working_dir: /var/www/
    environment:
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./:/var/www/
    networks:
      - edsa
  db:
    image: mariadb:10.11.13-jammy
    container_name: edsa_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_edsa:/var/lib/mysql
    networks:
      - edsa
  pma:
    image: phpmyadmin:5.2.2-apache
    container_name: edsa_phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_USER=${DB_USERNAME}
      - PMA_PASSWORD=${DB_PASSWORD}
    networks:
      - edsa
    ports:
      - "8080:80"
    depends_on:
      - db
  dash:
    image: nginx:1.28.0-alpine
    container_name: edsa_dashboard
    restart: unless-stopped
    volumes:
      - ./:/var/www/
      - ./docker/nginx:/etc/nginx/conf.d
    networks:
      - edsa
    ports:
      - "8000:80"
    depends_on:
      - app
networks:
  edsa:
    driver: bridge
volumes:
  db_edsa:
