services:
  app:
    image: edsa:1.0.0-api
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: edsa_laravel
    restart: unless-stopped
    volumes:
      - ./api:/var/www/html
    ports:
      - "8000:80"
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-db_edsa}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      - db
    networks:
      - edsa
  db:
    image: mariadb:10.11.13
    container_name: edsa_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-db_edsa}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - ${DB_PORT:-3306}:3306
    volumes:
      - ./db_edsa:/var/lib/mysql
    networks:
      - edsa
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  edsa:
volumes:
  db_edsa:
